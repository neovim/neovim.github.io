name: "Build Hugo Site"
description: "Shared build logic"

runs:
  using: "composite"
  steps:
    - name: Checkout neovim/neovim
      uses: actions/checkout@v6
      with:
        repository: neovim/neovim
        path: 'neovim'
    - name: Install Nvim
      shell: bash
      run: |
        cd ./neovim
        sudo make install
    - name: Install Hugo CLI
      shell: bash
      env:
        HUGO_VERSION: "0.162.1"
      run: |
        wget -O ${{ runner.temp }}/hugo.deb \
          https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
        && sudo dpkg -i ${{ runner.temp }}/hugo.deb
    - name: Get Nvim docs
      shell: bash
      run: |
        ./gendoc.lua ./neovim

    # :help docs PDF, served at /doc/user/nvim-help.pdf. After gendoc.lua, which builds the helptags.
    #
    # TODO: --generate-pdf-document-outline might be nice, but bloats size from 15 => 50 MB.
    - name: Generate help PDF
      shell: bash
      run: |
        (cd ./neovim && nvim -V1 -es --clean +"lua require('src.gen.gen_help_html').gen('print', './runtime/doc', '${{ runner.temp }}/print')" +q)
        mkdir -p static/doc/user
        # --no-sandbox: Ubuntu restricts the user namespaces that Chrome's sandbox needs.
        google-chrome --headless --no-sandbox --no-pdf-header-footer --disable-pdf-tagging \
          --print-to-pdf=static/doc/user/nvim-help.pdf "${{ runner.temp }}/print/print.html"
        test -s static/doc/user/nvim-help.pdf

    - name: Build with Hugo
      shell: bash
      env:
        # For backward compatibility with Hugo modules
        HUGO_ENVIRONMENT: production
        HUGO_ENV: production
      run: |
        hugo --gc

